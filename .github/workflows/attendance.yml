# Save in your repo as:  .github/workflows/attendance.yml
#
# Runs on YOUR computer through a self-hosted GitHub runner (free, no cloud compute).
# GitHub only sends the "start" signal and stores your secrets; the agent, the LLM
# (Ollama) and the browser all run locally.
#
# Use a PRIVATE repo: it holds portal credentials and student data, and GitHub
# advises against self-hosted runners on public repos.

name: Attendance agent

on:
  workflow_dispatch:            # "Run workflow" button = start it now
  schedule:
    - cron: "30 2 * * 1-6"      # 08:00 IST, Mon-Sat (GitHub cron is UTC; may start a few minutes late)

concurrency:
  group: attendance-watcher     # never two copies marking at once
  cancel-in-progress: true      # a manual start replaces the running copy

jobs:
  watch:
    runs-on: self-hosted
    timeout-minutes: 660        # hard stop after 11 h
    env:
      PORTAL_URL: ${{ secrets.PORTAL_URL }}
      PORTAL_USER: ${{ secrets.PORTAL_USER }}
      PORTAL_PASS: ${{ secrets.PORTAL_PASS }}
      SHEET_ID: ${{ secrets.SHEET_ID }}
      GOOGLE_CREDS_JSON: ${{ secrets.GOOGLE_CREDS_JSON }}   # leave unset if SHEET_MODE=csv_link
      SHEET_MODE: service_account
      WORKSHEET: Attendance
      RUN_FOR_SECONDS: "36000"  # watch for 10 h, then exit cleanly
      OLLAMA_MODEL: qwen2.5:14b
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install chromium
      - name: Check local Ollama is running
        run: python -c "import urllib.request; urllib.request.urlopen('http://localhost:11434', timeout=5); print('Ollama OK')"
      - name: Watch sheet and mark attendance
        run: python attendance_watcher.py
